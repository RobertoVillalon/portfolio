name: Update Projects

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Nombre del proyecto"
        required: true
      description:
        description: "Descripción"
        required: true
      status:
        type: choice
        description: "Estado del proyecto"
        required: true
        options:
          - "Activo"
          - "Actualización Futura"
          - "Finalizado"
      creationDate:
        description: "Fecha de creación (YYYY-MM-DD)"
        required: true
      lastUpdateDate:
        description: "Fecha de última actualización (YYYY-MM-DD)"
        required: true
      technologies:
        description: "Tecnologías utilizadas (separadas por comas)"
        required: true
      repositoryUrl:
        description: "URL del repositorio (opcional)"
        required: false
      demoUrl:
        description: "URL de la demo (opcional)"
        required: false
permissions:
  contents: write
  pull-requests: write

jobs:
  update-degrees:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          
      - name: Update degrees.json
        run: |
          FILE="src/assets/data/projects.json"

          node -e "
          const fs = require('fs');
          const file = '$FILE';

          let data = [];

          if (fs.existsSync(file)) {
            data = JSON.parse(fs.readFileSync(file, 'utf-8'));
          }

          if (!Array.isArray(data)) {
            throw new Error('projects.json debe ser un array');
          }

          const newItem = {
            name: '${{ github.event.inputs.name }}',
            description: '${{ github.event.inputs.description }}',
            status: '${{ github.event.inputs.status }}',
            creationDate: '${{ github.event.inputs.creationDate }}',
            lastUpdateDate: '${{ github.event.inputs.lastUpdateDate }}',
            technologies: '${{ github.event.inputs.technologies }}'
          };

          if(${{ github.event.inputs.repositoryUrl }}){
            newItem.repoLink = '${{ github.event.inputs.repositoryUrl }}';
          }

          if(${{ github.event.inputs.demoUrl }}){
            newItem.demoLink = '${{ github.event.inputs.demoUrl }}';
          }

          const objectIndex = data.findIndex(project => project.name === newItem.name)

          if(objectIndex != -1){
            data[objectIndex] = newItem
          }
          else{
            data.push(newItem)
          }
          
          fs.writeFileSync(file, JSON.stringify(data, null, 2));
          "

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat: se añade ${{github.event.inputs.name}}"
          branch: "update/projects-${{ github.run_id }}"
          title: "Se añade ${{github.event.inputs.name}}"
          body: "Automated update to projects.json"
