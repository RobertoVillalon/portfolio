<div class="space-y-2">
  @for (edu of education(); track $index) {
    <div
      class="p-5 rounded-xl border border-[#ecf0f1] shadow-xs bg-white dark:bg-neutral-900 dark:border-neutral-700"
    >
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
        <div>
          <h3 class="text-sm font-semibold text-gray-800 dark:text-neutral-100">
            {{ edu.degree }}
          </h3>
          <p class="text-sm text-gray-600 dark:text-neutral-400">
            {{ edu.institution }}
          </p>
        </div>

        <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-blue-100 text-blue-800 dark:bg-blue-800/20 dark:text-blue-400">
          {{ edu.period }}
        </span>
      </div>

      @if (edu.description) {
        <p class="mt-3 text-sm text-gray-700 dark:text-neutral-300">
          {{ edu.description }}
        </p>
      }
    </div>
  }
</div>
