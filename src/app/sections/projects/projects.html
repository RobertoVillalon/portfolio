<div class="grid lg:grid-cols-9 bg-white dark:bg-neutral-900 p-4 rounded-lg shadow-xs lg:gap-4">
  <div class="lg:block hidden lg:col-span-2 ">
    <tabs tabListKey="projects" [isVertical]="true" [items]="projectList()" />
  </div>
  
  <div class="lg:hidden sm:md:block ">
    <app-select selectorKey="projects" title="Proyectos" [items]="projectList()"/>
  </div>

  <div class="flex flex-col lg:col-span-7">
    <tabs tabListKey="menuItems" [isVertical]="false" [items]="projectMenuItems()" />
    <div class="h-full">
      @switch (selectedMenuItem()) {
        @case ("Contexto") {
          <context-project-component [currentProject]="selectedProject()" [currentItem]="selectedMenuItem()"/>
        }
        @case ("Imagenes"){
          <images-project-component [currentProject]="selectedProject()" [currentItem]="selectedMenuItem()" />
        }
        @default {
          <h1>not exist</h1>
        }
      }
    </div>
    @if (selectedProject() || selectedProject().repoLink || selectedProject().demoLink) {
      <div class="flex p-2 justify-center gap-5">
        @if (selectedProject().repoLink) {
          <a
            [href]="selectedProject().repoLink"
            target="_blank"
            class="inline-flex items-center gap-x-2 px-4 py-2 rounded-lg text-sm font-medium bg-gray-900 text-white hover:bg-gray-800 dark:bg-neutral-100 dark:text-neutral-900 dark:hover:bg-neutral-200">
            <i class="icon-[tabler--brand-github] shrink-0 size-5"></i>
            Repositorio
          </a>
        }

        @if (selectedProject().demoLink) {
          <a
            [href]="selectedProject().demoLink"
            target="_blank"
            class="inline-flex items-center gap-x-2 px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white hover:bg-blue-500">
            <i class="icon-[tabler--external-link] shrink-0 size-5"></i>
            Ir al proyecto
          </a>
        }
      </div>
    }

  </div>

</div>
