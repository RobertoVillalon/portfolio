<div class="space-y-5">
    @for (cert of certifications(); track $index) {
    <div
        class="flex items-center gap-4 p-4 rounded-xl border border-[#ecf0f1] bg-white dark:bg-neutral-900 dark:border-neutral-700"
    >
    <span [className]="iconService.getIconClass('' + cert.icon) + ' shrink-0 size-6'"></span>

        <div class="flex-1">
        <p class="text-sm font-semibold text-gray-800 dark:text-neutral-100">
            {{ cert.name }}
        </p>
        <p class="text-xs text-gray-600 dark:text-neutral-400">
            {{ cert.provider }}
        </p>
        </div>

        <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-blue-100 text-blue-800 dark:bg-blue-800/20 dark:text-blue-400">
        {{ cert.issueDate }}
        
        </span>
    </div>
    }
</div>
